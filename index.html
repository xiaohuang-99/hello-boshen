<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Missing Pearl</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='46' fill='%23EAF6FB' stroke='%23F25A7E' stroke-width='6'/%3E%3Cellipse cx='44' cy='42' rx='13' ry='9' fill='%23FFFFFF' transform='rotate(-25 44 42)'/%3E%3C/svg%3E">
<style>
  :root{
    --bg1:#0B6E9C; --bg2:#2AA8B8;
    --ink:#10364F; --sub:#55758C;
    --card:#ffffff;
    --primary:#FF7B9C; --primaryD:#F25A7E;
    --sand:#FFD98E; --sandD:#E8B84F;
    --ok:#2FBF71; --okD:#1FA85C;
    --bad:#FF6B6B; --badD:#E85050;
    --teal:#1FA8A0;
    --radius:22px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Baloo 2","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1) 0%, var(--bg2) 72%);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; cursor:pointer; border:none;}
  input{font-family:inherit;}
  :focus-visible{outline:3px solid var(--sand); outline-offset:2px;}

  /* ===== 背景气泡装饰 ===== */
  .bubbles{position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0;}
  .bubbles i{position:absolute; border-radius:50%; background:rgba(255,255,255,.16); animation:rise 9s ease-in-out infinite;}
  .bubbles .b1{width:14px;height:14px;left:10%;top:70%;}
  .bubbles .b2{width:8px;height:8px;left:85%;top:60%;animation-delay:1.4s;}
  .bubbles .b3{width:20px;height:20px;left:68%;top:82%;animation-delay:2.2s;}
  .bubbles .b4{width:10px;height:10px;left:30%;top:85%;animation-delay:.7s;}
  .bubbles .b5{width:16px;height:16px;left:48%;top:15%;animation-delay:3s;}
  @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

  /* ===== 布局 ===== */
  .stage{position:relative; z-index:1; max-width:540px; margin:0 auto; padding:18px 16px 60px;}

  .topbar{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
  .topbar .back{min-width:46px; min-height:46px; border-radius:14px; background:rgba(255,255,255,.92); color:var(--ink); font-size:20px; box-shadow:0 4px 10px rgba(16,54,79,.18);}
  .topbar .title{flex:1; font-size:17px; font-weight:800; color:#fff; text-shadow:0 2px 6px rgba(16,54,79,.3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mute{min-width:46px; min-height:46px; border-radius:14px; background:rgba(255,255,255,.92); color:var(--ink); display:flex; align-items:center; justify-content:center; box-shadow:0 4px 10px rgba(16,54,79,.18);}
  .mute svg{width:22px;height:22px;}

  .card{background:var(--card); border-radius:var(--radius); padding:20px 18px; box-shadow:0 10px 26px rgba(16,54,79,.18);}

  .view{display:none;}
  .view.active{display:block; animation:fadein .28s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}

  /* ===== 首页 ===== */
  .hero{text-align:center; margin:6px 0 2px;}
  .hero-img{width:132px;height:132px;margin:0 auto; border-radius:50%; border:5px solid rgba(255,255,255,.85); overflow:hidden; box-shadow:0 12px 26px rgba(16,54,79,.3); background:#fff;}
  .hero-img img{width:100%;height:100%;object-fit:cover; display:block;}
  .hero h1{margin:12px 0 4px; font-size:32px; font-weight:900; color:#fff; text-shadow:0 3px 0 rgba(16,54,79,.25),0 8px 18px rgba(16,54,79,.35); letter-spacing:.5px;}
  .hero p{margin:0 auto; color:#fff; font-size:15px; font-weight:600; text-shadow:0 2px 6px rgba(16,54,79,.35); max-width:340px; line-height:1.5;}

  .total-chip{margin:14px auto 0; display:none; align-items:center; gap:8px; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.5); color:#fff; font-weight:800; font-size:15px; padding:8px 18px; border-radius:999px; width:max-content;}
  .total-chip .pearl{width:20px;height:20px;}

  .section-label{color:#fff; font-weight:800; font-size:15px; margin:20px 0 10px; text-shadow:0 2px 6px rgba(16,54,79,.3); display:flex; align-items:center; gap:8px;}
  .section-label::after{content:""; flex:1; height:2px; background:rgba(255,255,255,.35); border-radius:2px;}

  .levels{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .level{background:var(--card); border-radius:var(--radius); overflow:hidden; text-align:left; box-shadow:0 10px 22px rgba(16,54,79,.2); transition:transform .12s; padding:0;}
  .level:active{transform:scale(.96);}
  .level .l-img{width:100%;height:96px;object-fit:cover; display:block; border-bottom:3px solid var(--primary);}
  .level .l-body{padding:10px 12px 12px;}
  .level b{font-size:15px; font-weight:900; color:var(--ink); display:block; margin-bottom:2px;}
  .level small{font-size:11.5px; color:var(--sub); line-height:1.35; display:block; min-height:32px;}
  .level .l-score{display:none; margin-top:6px; font-size:12.5px; font-weight:800; color:var(--primaryD); background:#FFEDF2; border-radius:999px; padding:3px 10px; width:max-content;}

  /* ===== 游戏区 ===== */
  .pearls{display:flex; justify-content:center; gap:9px; margin-bottom:12px;}
  .pearls .dot{width:30px;height:30px; filter:grayscale(1) opacity(.45);}
  .pearls .dot.on{filter:none; animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

  .game-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; color:#fff; gap:8px;}
  .game-head .qcount{font-weight:800; font-size:14px; background:rgba(255,255,255,.2); padding:5px 12px; border-radius:999px; white-space:nowrap;}
  .game-head .score{font-weight:900; font-size:15px; background:var(--sand); color:#7A5A00; padding:5px 14px; border-radius:999px; box-shadow:0 3px 0 rgba(0,0,0,.12); white-space:nowrap;}

  .q-box{text-align:center;}
  .q-box .word-img{width:150px;height:150px; margin:6px auto 4px; border-radius:20px; overflow:hidden; border:4px solid #EAF3F8; box-shadow:0 8px 20px rgba(16,54,79,.16); background:#fff;}
  .q-box .word-img img{width:100%;height:100%;object-fit:cover; display:block;}
  .q-box .en-big{font-size:24px; font-weight:900; margin:8px 0 2px;}
  .q-box .cn-line{font-size:19px; font-weight:700; color:var(--ink);}
  .q-box .pin-line{font-size:15px; color:var(--sub); letter-spacing:.3px; margin-top:2px;}

  .sound-btn{display:inline-flex; align-items:center; gap:8px; margin:12px 4px 4px; background:linear-gradient(150deg,#FF9A6B,#FF7A59); color:#fff; font-weight:800; font-size:15px; padding:12px 20px; border-radius:999px; box-shadow:0 5px 0 #E85D3A; transition:transform .08s;}
  .sound-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #E85D3A;}
  .sound-btn svg{width:20px;height:20px;}

  /* 拼写：自己输入 */
  .slots{display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:14px 0 10px;}
  .slot{width:46px;height:56px; border-radius:12px; border:2px dashed #C6D4E4; background:#F5F9FF; display:flex; align-items:center; justify-content:center; font-size:26px; font-weight:900; color:var(--ink); text-transform:uppercase;}
  .slot.fill{border-style:solid; border-color:var(--teal); background:#E9FBF7;}
  .spell-form{margin-bottom:14px;}
  .form-label{font-size:15px; font-weight:800; color:var(--teal); margin-bottom:4px; display:flex; gap:8px; justify-content:center; align-items:baseline;}
  .form-label span{font-size:13px; color:var(--sub); font-weight:700;}
  .spell-input{width:100%; max-width:320px; height:64px; border-radius:16px; border:3px solid #DCE7F0; background:#F7FBFF; text-align:center; font-size:30px; font-weight:900; letter-spacing:8px; text-transform:lowercase; color:var(--ink);}
  .spell-input:focus{border-color:var(--primary); outline:none; background:#fff;}
  .hint-toggle{font-size:13px; font-weight:700; color:var(--teal); background:#E9FBF7; border-radius:999px; padding:8px 14px; margin:10px 4px 4px;}

  .primary-btn{display:block; width:100%; margin-top:16px; background:linear-gradient(150deg,#FF9A6B,#FF7A59); color:#fff; font-size:18px; font-weight:900; padding:15px; border-radius:999px; box-shadow:0 6px 0 #E85D3A; transition:transform .08s;}
  .primary-btn:active{transform:translateY(3px); box-shadow:0 2px 0 #E85D3A;}
  .primary-btn:disabled{opacity:.5; box-shadow:0 3px 0 #E85D3A; cursor:default; transform:none;}

  /* 配对 */
  .match-tip{font-size:14px; font-weight:700; color:var(--sub); margin-bottom:12px;}
  .pair-area{position:relative;}
  .pair-cols{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .pair-col{display:flex; flex-direction:column; gap:10px;}
  .pair-col .col-label{font-size:12px; font-weight:800; color:var(--sub); text-align:center;}
  .pair-card{min-height:56px; border-radius:14px; border:2px solid #E3EAF3; background:#fff; display:flex; align-items:center; justify-content:center; padding:6px 10px; text-align:center; font-weight:800; transition:transform .1s, border-color .1s, background .1s;}
  .pair-card.en{font-size:16px; color:var(--ink); text-transform:capitalize;}
  .pair-card.cn{flex-direction:column; gap:1px; font-size:15px; color:var(--ink);}
  .pair-card .py{font-size:12px; color:var(--sub); font-weight:600;}
  .pair-card.selected{border-color:var(--sand); background:#FFF8E1; transform:scale(1.04);}
  .pair-card.linked{border-color:var(--ok); background:#E9FBF2; pointer-events:none;}
  .pair-card.wrong{border-color:var(--bad); background:#FFECEC; animation:shake .4s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
  #pairSvg{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:2;}

  /* 选项 */
  .options{display:flex; flex-direction:column; gap:12px; margin-top:16px;}
  .opt{min-height:62px; border-radius:16px; border:2px solid #E3EAF3; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:10px; font-weight:800; transition:transform .1s, border-color .1s, background .1s;}
  .opt:active{transform:scale(.98);}
  .opt .main{font-size:17px; color:var(--ink);}
  .opt .sub{font-size:13px; color:var(--sub);}
  .opt.right{border-color:var(--ok); background:#E9FBF2; animation:okpop .4s ease;}
  .opt.wrong{border-color:var(--bad); background:#FFECEC; animation:shake .4s ease;}
  @keyframes okpop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}

  /* 完形填空 */
  .passage{font-size:17px; font-weight:700; line-height:2; text-align:left; color:var(--ink);}
  .passage .blank{display:inline-block; min-width:92px; border-bottom:3px dashed var(--teal); text-align:center; font-weight:900; color:var(--teal); cursor:pointer; padding:0 6px; margin:0 2px; border-radius:6px 6px 0 0;}
  .passage .blank.sel{background:#FFF8E1; border-color:var(--sandD); color:#7A5A00;}
  .passage .blank.filled{background:#E9FBF7; border-bottom-style:solid; text-transform:lowercase;}
  .passage .blank.good{background:#E9FBF2; border-color:var(--ok); color:var(--okD);}
  .passage .blank.bad{background:#FFECEC; border-color:var(--bad); color:var(--badD);}
  .wordbank{margin-top:16px; padding-top:12px; border-top:2px dashed #DCE7F0; display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .bank-label{width:100%; text-align:center; font-size:13px; font-weight:800; color:var(--sub);}
  .word-btn{min-height:48px; border-radius:14px; border:2px solid #DCE7F0; background:#fff; font-size:16px; font-weight:900; color:var(--ink); padding:0 18px; text-transform:capitalize; box-shadow:0 3px 0 rgba(16,54,79,.12); transition:transform .06s;}
  .word-btn:active{transform:translateY(2px);}
  .word-btn.sel{border-color:var(--sandD); background:#FFF8E1;}
  .word-btn.used{opacity:.3; pointer-events:none;}

  /* 反馈 */
  .fb{min-height:34px; margin-top:14px; text-align:center; font-weight:900; font-size:17px;}
  .fb.ok{color:var(--okD);}
  .fb.no{color:var(--badD);}
  .fb.small{font-size:14px; font-weight:700; color:var(--sub);}

  /* ===== 结算 ===== */
  .result-box{text-align:center; padding:26px 18px;}
  .result-box h2{margin:6px 0 4px; font-size:26px; font-weight:900;}
  .score-big{font-size:52px; font-weight:900; color:var(--primaryD); margin:6px 0 2px; line-height:1.1;}
  .score-label{font-size:14px; font-weight:800; color:var(--sub);}
  .correct-line{font-size:15px; color:var(--sub); margin-top:8px; font-weight:700;}
  .result-pearls{display:flex; justify-content:center; gap:9px; margin:14px 0 4px;}
  .result-pearls .dot{width:40px;height:40px; filter:grayscale(1) opacity(.45);}
  .result-pearls .dot.on{filter:none; animation:pop .4s ease;}
  .result-actions{display:flex; flex-direction:column; gap:10px; margin-top:20px;}
  .ghost-btn{display:block; width:100%; background:#F1F6FB; color:var(--ink); font-weight:800; font-size:16px; padding:14px; border-radius:999px; box-shadow:0 4px 0 #DCE7F0;}

  /* 总分 */
  .total-table{margin-top:14px; text-align:left;}
  .trow{display:flex; justify-content:space-between; align-items:center; padding:11px 6px; border-bottom:1px solid #EAF0F6; font-size:15px; font-weight:800;}
  .trow:last-child{border-bottom:none;}
  .trow .tname{display:flex; align-items:center; gap:10px;}
  .trow .tname img{width:34px;height:34px;border-radius:10px;object-fit:cover;}
  .trow .tval{color:var(--sub); font-weight:800;}
  .trow.total{font-size:18px; font-weight:900; color:var(--primaryD); border-top:2px solid #EAF0F6; margin-top:6px; padding-top:14px;}

  /* 撒花 */
  .confetti{position:fixed; top:-20px; z-index:50; pointer-events:none;}
  .confetti span{position:absolute; top:0; border-radius:3px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(115vh) rotate(720deg); opacity:.9;}}

  /* ===== 全局字号放大 & 首页图片显示优化（覆盖） ===== */
  .hero-img{width:152px;height:152px; border-width:6px;}
  .hero-img img{object-fit:contain;}
  .level .l-img{height:142px; object-fit:contain; background:#fff; padding:6px;}
  .q-box .word-img{width:176px;height:176px;}
  .q-box .word-img img{object-fit:contain;}
  .topbar .title{font-size:20px;}
  .hero h1{font-size:42px;}
  .hero p{font-size:18px; max-width:380px;}
  .total-chip{font-size:17px;}
  .section-label{font-size:18px;}
  .level b{font-size:18px;}
  .level small{font-size:15px; min-height:40px;}
  .level .l-score{font-size:15px;}
  .game-head .qcount{font-size:17px;}
  .game-head .score{font-size:18px;}
  .q-box .en-big{font-size:28px;}
  .q-box .cn-line{font-size:24px;}
  .q-box .pin-line{font-size:18px; word-spacing:3px;}
  .sound-btn{font-size:17px; padding:14px 24px;}
  .slot{width:52px; height:66px; font-size:32px;}
  .spell-input{height:70px; font-size:36px; letter-spacing:10px;}
  .form-label{font-size:19px;}
  .form-label span{font-size:16px;}
  .hint-toggle{font-size:16px;}
  .primary-btn{font-size:21px; padding:17px;}
  .match-tip{font-size:17px;}
  .col-label{font-size:13px;}
  .pair-card{min-height:62px;}
  .pair-card.en{font-size:19px; gap:6px;}
  .pair-card .py{font-size:15px; word-spacing:2px;}
  .py-ic{width:17px;height:17px; opacity:.65; flex:none;}
  .en-item{display:flex; align-items:stretch; gap:6px;}
  .en-item .pair-card{flex:1;}
  .mini-say{width:48px; min-height:62px; border-radius:14px; border:2px solid #E3EAF3; background:#fff; color:var(--teal); display:flex; align-items:center; justify-content:center; transition:transform .06s;}
  .mini-say:active{transform:scale(.92);}
  .mini-say svg{width:20px;height:20px;}
  .opt .main{font-size:20px;}
  .opt .sub{font-size:16px; word-spacing:2px;}
  .passage{font-size:20px;}
  .bank-label{font-size:15px;}
  .word-btn{font-size:19px; padding:8px 14px; display:flex; flex-direction:column; align-items:center; gap:2px; line-height:1.15;}
  .word-btn .wb-en{font-weight:900; font-size:19px;}
  .word-btn .wb-cn{font-size:13px; color:var(--sub); font-weight:700;}
  .fb{font-size:19px;}
  .fb.small{font-size:16px;}
  .result-box h2{font-size:32px;}
  .score-big{font-size:60px;}
  .score-label{font-size:17px;}
  .correct-line{font-size:18px;}
  .ghost-btn{font-size:19px;}
  .trow{font-size:18px;}
  .trow.total{font-size:21px;}
  .opt.wrong{pointer-events:none;}
  .passage .blank.good{pointer-events:none;}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>
  <div class="bubbles" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i><i class="b5"></i></div>

  <!-- ============ HOME ============ -->
  <div id="view-home" class="view active">
    <div class="stage">
      <div class="topbar">
        <span style="flex:1"></span>
        <button class="mute" id="muteBtn" role="switch" aria-checked="false" title="Sound on / off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg></button>
      </div>
      <div class="hero">
        <div class="hero-img"><img src="assets/mermaid.jpg" alt="Mermaid Marina"></div>
        <h1>The Missing Pearl</h1>
        <p>Help Marina find her lost pearl! Play a game and earn points.</p>
        <div class="total-chip" id="totalChip"></div>
      </div>

      <div class="section-label">Choose a game</div>
      <div class="levels">
        <button class="level" data-idx="0">
          <img class="l-img" src="assets/mermaid.jpg" alt="Word Spelling">
          <span class="l-body"><b>1. Word Spelling</b><small>Look, listen and type the word</small><span class="l-score" data-lv="spell">Score: —</span></span>
        </button>
        <button class="level" data-idx="1">
          <img class="l-img" src="assets/pearl.jpg" alt="Word Match">
          <span class="l-body"><b>2. Word Match</b><small>Tap the English and Chinese pairs</small><span class="l-score" data-lv="match">Score: —</span></span>
        </button>
        <button class="level" data-idx="2">
          <img class="l-img" src="assets/seahorse.jpg" alt="Sentence Translation">
          <span class="l-body"><b>3. Sentence Translation</b><small>Pick the right meaning</small><span class="l-score" data-lv="trans">Score: —</span></span>
        </button>
        <button class="level" data-idx="3">
          <img class="l-img" src="assets/squid.jpg" alt="Fill in the Blanks">
          <span class="l-body"><b>4. Fill in the Blanks</b><small>Complete the story with the words</small><span class="l-score" data-lv="blank">Score: —</span></span>
        </button>
      </div>
    </div>
  </div>

  <!-- ============ GAME ============ -->
  <div id="view-game" class="view">
    <div class="stage">
      <div class="topbar">
        <button class="back" id="backBtn">←</button>
        <div class="title" id="gameTitle">Word Spelling</div>
        <button class="mute" id="muteBtn2" role="switch" aria-checked="false" title="Sound on / off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg></button>
      </div>
      <div class="pearls" id="pearls"></div>
      <div class="game-head">
        <span class="qcount" id="qcount">Question 1 / 5</span>
        <span class="score" id="scoreBar">Score: 0</span>
      </div>
      <div class="card q-box" id="gameBody"></div>
    </div>
  </div>

  <!-- ============ LEVEL RESULT ============ -->
  <div id="view-result" class="view">
    <div class="stage">
      <div class="topbar">
        <span style="flex:1"></span>
        <button class="mute" id="muteBtn3" role="switch" aria-checked="false" title="Sound on / off"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg></button>
      </div>
      <div class="card result-box" id="resultBox"></div>
    </div>
  </div>

  <!-- ============ TOTAL ============ -->

/* =====================================================================

/* ---------- state ---------- */
const S = {
  unit: null,
  levelIdx: 0,
  queue: [], idx: 0,
  correct: 0, wrong: 0, score: 0,
  input: "", inputPast: "",
  hintOn: true,
  sel: null, pairs: [], matchGroups: [], matchGi: 0,
  blanks: [], selBlank: -1, selWord: -1, bankOrder: [], locked: [],

  muted: localStorage.getItem("wb_muted2") === "1"
};
function storeScores(){ localStorage.setItem("tmp_scores", JSON.stringify(loadScores())); }
function loadScores(){
  try{ return JSON.parse(localStorage.getItem("tmp_scores") || "{}"); }catch(e){ return {}; }
}
function totalScore(){
  const sc = loadScores();
  return LEVELS.reduce((sum, l) => sum + (sc[l.id] || 0), 0);

/* ---------- helpers ---------- */
function $(id){ return document.getElementById(id); }
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function showView(name){
  ["home","game","result","total"].forEach(v => $("view-"+v).classList.remove("active"));
  $("view-"+name).classList.add("active");
  window.scrollTo(0,0);
}

/* ---------- sound: English TTS ---------- */
function speak(text){
  try{
    if (!("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.9; u.pitch = 1.05;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(x => /en[-_]US/i.test(x.lang)) || vs.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}

/* ---------- sound effects ---------- */
let actx = null;
function ensureAudio(){
  try{
    if (!actx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) actx = new AC();
    }
    if (actx && actx.state === "suspended") actx.resume();
  }catch(e){}
}
function tone(freq, dur, type, vol, delay){
  if (S.muted || !actx) return;
  try{
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = type || "sine";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol || 0.32, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }catch(e){}
}
function sClick(){ tone(660, .09, "triangle", .22); }
function sRight(){
  tone(523, .12, "sine", .28); tone(659, .12, "sine", .28, .09); tone(784, .2, "sine", .28, .18);
}
function sWrong(){ tone(200, .22, "sawtooth", .15); tone(160, .25, "sawtooth", .13, .1); }
function sWin(){ tone(880, .14, "triangle", .28); tone(1175, .22, "triangle", .28, .1); }

/* ---------- mute ---------- */
function soundIcon(on){
  return on
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10v4h4l5 4V6L7 10H3z" fill="currentColor" stroke="none"/><path d="M16 9l6 6"/><path d="M22 9l-6 6"/></svg>';
}
function paintMute(){
  const on = !S.muted;
  ["muteBtn","muteBtn2","muteBtn3","muteBtn4"].forEach(id => { const b=$(id); if(b){ b.innerHTML = soundIcon(on); b.setAttribute("aria-checked", String(on)); } });
}
function bindMute(){
  ["muteBtn","muteBtn2","muteBtn3","muteBtn4"].forEach(id => {
    $(id).addEventListener("click", (e)=>{
      e.stopPropagation();
      ensureAudio();
      S.muted = !S.muted;
      localStorage.setItem("wb_muted2", S.muted ? "1" : "0");
      paintMute();
      if (!S.muted) sClick();
    });
  });
}

/* ---------- pearl icon ---------- */
function pearlSVG(){
  return '<svg viewBox="0 0 120 120"><defs><radialGradient id="pg" cx="35%" cy="30%" r="80%"><stop offset="0%" stop-color="#FFFFFF"/><stop offset="55%" stop-color="#EAF6FB"/><stop offset="100%" stop-color="#B9DCE8"/></radialGradient></defs><circle cx="60" cy="60" r="46" fill="url(#pg)" stroke="#9FC7D8" stroke-width="5"/><ellipse cx="42" cy="40" rx="13" ry="8" fill="#FFFFFF" opacity=".95" transform="rotate(-25 42 40)"/></svg>';
}
function pearlsHTML(count, max, cls){
  let h = "";
  for (let i=0;i<max;i++){
    h += `<span class="dot ${i<count?"on":""} ${cls||""}">${pearlSVG()}</span>`;
  }
  return h;
}

/* ---------- scoring ---------- */
function addScore(right){
  if (right){ S.correct++; S.score += 3; }
  else { S.wrong++; S.score = Math.max(0, S.score - 1); }
  paintHead();
}
function paintHead(){
  const stars = Math.min(5, S.correct);
  const pearls = $("pearls"); if (pearls) pearls.innerHTML = pearlsHTML(stars, 5);
  const qc = $("qcount");
  if (qc){
    if (S.mode === "match"){
      const g = S.matchGroups[S.matchGi];
      qc.textContent = "Group " + (S.matchGi+1) + "/" + S.matchGroups.length + " · " + S.pairs.length + "/" + g.length;
    }
    else if (S.mode === "blank") qc.textContent = "Story";
    else qc.textContent = "Question " + (S.idx+1) + " / " + S.queue.length;
  }
  const sb = $("scoreBar"); if (sb) sb.textContent = "Score: " + S.score;
}

/* ---------- home ---------- */
function renderHome(){
  S.unit = QUESTION_BANK.units[0];
  const sc = loadScores();
  const done = LEVELS.filter(l => sc[l.id] !== undefined).length;
  const chip = $("totalChip");
  if (done > 0){
    chip.style.display = "flex";
    chip.innerHTML = '<span class="pearl">' + pearlSVG() + '</span><span>Total Score: ' + totalScore() + "</span>";
  } else chip.style.display = "none";
  LEVELS.forEach((l, i) => {
    const s = sc[l.id];
    const el = document.querySelector('.level[data-idx="' + i + '"] .l-score');
    if (el){ el.style.display = s !== undefined ? "inline-block" : "none"; el.textContent = "Score: " + s; }
  });
}

/* ---------- start a level ---------- */
function startLevel(i){
  ensureAudio(); sClick();
  S.levelIdx = i;
  S.mode = LEVELS[i].id;
  S.correct = 0; S.wrong = 0; S.score = 0;
  S.input = ""; S.inputPast = ""; S.sel = null; S.pairs = [];
  S.blanks = []; S.selBlank = -1; S.selWord = -1;
  S.answered = false;
  $("gameTitle").textContent = LEVELS[i].name;
  if (S.mode === "spell"){ S.queue = shuffle(S.unit.spell); }
  else if (S.mode === "match"){
    // split the 21 words into groups of 6 (last group may be smaller)
    const all = shuffle(S.unit.match);
    S.matchGroups = [];
    for (let k=0;k<all.length;k+=6) S.matchGroups.push(all.slice(k, k+6));
    S.matchGi = 0;
  }
  else if (S.mode === "trans"){ S.queue = shuffle(S.unit.trans); }
  else if (S.mode === "blank"){
    S.blanks = Array(S.unit.blank.passage.blanks.length).fill(null);
    S.bankOrder = shuffle(S.unit.blank.words);
    S.locked = Array(S.unit.blank.passage.blanks.length).fill(false);
  }
  S.idx = 0;
  showView("game");
  renderGame();
}

/* ---------- game render ---------- */
function renderGame(){
  paintHead();
  const body = $("gameBody");
  if (S.mode === "spell") body.innerHTML = spellHTML();
  if (S.mode === "match") body.innerHTML = matchHTML();
  if (S.mode === "trans") body.innerHTML = transHTML();
  if (S.mode === "blank") body.innerHTML = blankHTML();
  bindGame();
  if (S.mode === "spell"){ speak(S.queue[S.idx].en); }
  if (S.mode === "spell"){ const inp = body.querySelector('.spell-input[data-tgt="base"]'); if (inp) setTimeout(()=>{ try{ inp.focus(); }catch(e){} }, 100); }
}
function fbHTML(text, cls){ return `<div class="fb ${cls}">${text}</div>`; }

/* ---------- 1) Word Spelling ---------- */
function spellHTML(){
  const w = S.queue[S.idx];
  const hasPast = !!w.past;
  function slotsFor(len, val){
    let s = "";
    for (let i=0;i<len;i++){
      s += `<span class="slot ${i < val.length ? "fill" : ""}">${val[i] ? val[i].toUpperCase() : ""}</span>`;
    }
    return s;
  }
  const baseSlots = slotsFor(w.en.length, S.input);
  const pastSlots = hasPast ? slotsFor(w.past.length, S.inputPast) : "";
  return `
    <div class="word-img"><img src="${w.img}" alt="${w.en}"></div>
    <button class="sound-btn" data-act="say" data-text="${w.en}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg>Hear it</button>
    <div class="spell-form">
      <div class="form-label">Base form <span>(原形)</span></div>
      <div class="slots" data-tgt="base">${baseSlots}</div>
      <input class="spell-input" data-tgt="base" maxlength="${w.en.length}" placeholder="Type the word..." autocapitalize="none" autocomplete="off" spellcheck="false" value="">
    </div>
    ${hasPast ? `
    <div class="spell-form">
      <div class="form-label">Past form <span>(过去式)</span></div>
      <div class="slots" data-tgt="past">${pastSlots}</div>
      <input class="spell-input" data-tgt="past" maxlength="${w.past.length}" placeholder="Type the past form..." autocapitalize="none" autocomplete="off" spellcheck="false" value="">
    </div>` : ""}
    <div style="min-height:26px; font-size:15px; color:var(--sub); font-weight:700; margin-top:8px;">${S.hintOn ? ("中文：" + w.cn + "　" + w.pinyin) : "&nbsp;"}</div>
    <button class="hint-toggle" data-act="hint">${S.hintOn ? "Hide Chinese" : "Show Chinese"}</button>
    <button class="primary-btn" data-act="check" disabled>Check</button>
    <div class="fb" id="spellFb"></div>`;
}
function spellCheck(){
  if (S.answered) return;
  const w = S.queue[S.idx];
  const hasPast = !!w.past;
  const ans = S.input.trim().toLowerCase();
  const ansPast = S.inputPast.trim().toLowerCase();
  const okBase = ans === w.en;
  const okPast = !hasPast || ansPast === w.past;
  if (!ans || (hasPast && !ansPast)) return;
  if (okBase && okPast){
    S.answered = true; addScore(true); sRight(); celebrate(14);
    const body = $("gameBody");
    body.querySelectorAll(".slot").forEach(el=>{ el.style.borderColor="var(--ok)"; el.style.background="#E9FBF2"; });
    $("spellFb").innerHTML = fbHTML(praise(), "ok");
    setTimeout(nextQ, 1200);
  } else {
    addScore(false); sWrong();
    const body = $("gameBody");
    body.querySelectorAll(".slot").forEach(el=>{ el.style.borderColor="var(--bad)"; el.style.background="#FFECEC"; });
    $("spellFb").innerHTML = fbHTML("Not quite. Try again!", "no");
    S.input = ""; S.inputPast = "";
    body.querySelectorAll(".spell-input").forEach(inp => inp.value = "");
    const btn = body.querySelector('[data-act="check"]');
    if (btn) btn.disabled = true;
    setTimeout(()=>{
      body.querySelectorAll(".slot").forEach(el=>{ el.style.borderColor=""; el.style.background=""; el.textContent=""; });
      const f = body.querySelector('.spell-input[data-tgt="base"]');
      if (f) f.focus();
    }, 800);
  }
}
function praise(){
  const list = ["Great job!", "Perfect!", "Awesome!", "Yes!", "Well done!"];
  return list[Math.floor(Math.random()*list.length)];
}

/* ---------- 2) Word Match ---------- */
let matchState = null;
function matchHTML(){
  const group = S.matchGroups[S.matchGi];
  matchState = { en: shuffle(group.map(w => w.en)), cn: shuffle(group.map(w => w)) };
  return `
    <div class="match-tip">Tap an English word, then tap its Chinese meaning. Tap the speaker to hear a word.</div>
    <div class="pair-area" id="pairArea">
      <svg id="pairSvg" width="100%" height="100%"></svg>
      <div class="pair-cols">
        <div class="pair-col">
          <div class="col-label">ENGLISH</div>
          ${matchState.en.map(e => `<div class="en-item"><button class="pair-card en" data-en="${e}">${e}</button><button class="mini-say" data-en="${e}" aria-label="Listen to ${e}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg></button></div>`).join("")}
        </div>
        <div class="pair-col">
          <div class="col-label">中文</div>
          ${matchState.cn.map(w => `<button class="pair-card cn" data-cn="${w.en}"><span>${w.cn}</span><span class="py">${w.pinyin}</span></button>`).join("")}
        </div>
      </div>
    </div>
    <div class="fb small" id="matchFb"></div>`;
}
function onPair(e){
  const el = e.target.closest(".pair-card");
  if (!el || el.classList.contains("linked")) return;
  ensureAudio(); sClick();
  const isEn = el.classList.contains("en");
  const id = isEn ? el.getAttribute("data-en") : el.getAttribute("data-cn");
  if (S.sel === null){
    S.sel = { type: isEn ? "en" : "cn", id: id, el: el };
    document.querySelectorAll(".pair-card").forEach(c=>c.classList.remove("selected"));
    el.classList.add("selected");
    return;
  }
  const sel = S.sel;
  if (sel.type === (isEn ? "en" : "cn")){ // same side → switch selection
    S.sel = { type: sel.type, id: id, el: el };
    document.querySelectorAll(".pair-card").forEach(c=>c.classList.remove("selected"));
    el.classList.add("selected");
    return;
  }
  // other side → check the pair
  const matched = sel.id === id;
  S.sel = null;
  document.querySelectorAll(".pair-card").forEach(c=>c.classList.remove("selected"));
  if (matched){
    addScore(true); sRight();
    const otherEl = sel.el;
    el.classList.add("linked"); otherEl.classList.add("linked");
    S.pairs.push({ en: sel.type === "en" ? otherEl : el, cn: sel.type === "cn" ? otherEl : el });
    drawLines();
    paintHead();
    $("matchFb").textContent = "";
    const group = S.matchGroups[S.matchGi];
    if (S.pairs.length >= group.length){
      if (S.matchGi < S.matchGroups.length - 1){ // more groups left → auto advance
        sWin(); celebrate(22);
        $("matchFb").innerHTML = '<span style="color:var(--teal); font-weight:900">Group complete! Next group...</span>';
        setTimeout(()=>{
          S.matchGi++;
          S.pairs = [];
          S.sel = null;
          renderGame();
        }, 1300);
      } else {
        sWin(); celebrate(36);
        $("matchFb").innerHTML = '<span style="color:var(--okD)">All pairs found!</span>';
        setTimeout(()=> finishLevel(), 1000);
      }
    }
  } else {
    addScore(false); sWrong();
    [el, sel.el].forEach(n=>{ n.classList.add("wrong"); setTimeout(()=>n.classList.remove("wrong"), 450); });
    $("matchFb").textContent = "";
  }
}
function drawLines(){
  const svg = $("pairSvg"); const area = $("pairArea");
  if (!svg || !area) return;
  const ar = area.getBoundingClientRect();
  let s = "";
  S.pairs.forEach(p => {
    const er = p.en.getBoundingClientRect();
    const cr = p.cn.getBoundingClientRect();
    if (!er.width || !cr.width) return;
    const x1 = er.right - ar.left, y1 = er.top + er.height/2 - ar.top;
    const x2 = cr.left - ar.left, y2 = cr.top + cr.height/2 - ar.top;
    s += '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="#2FBF71" stroke-width="4" stroke-linecap="round"/>';
  });
  svg.innerHTML = s;
}

/* ---------- 3) Sentence Translation ---------- */
function transHTML(){
  const s = S.queue[S.idx];
  const opts = transOptions(s);
  return `
    <div style="font-size:22px; font-weight:900; margin:6px 0 2px; line-height:1.4;">${s.en}</div>
    <button class="sound-btn" data-act="say" data-text="${s.en}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg>Hear it</button>
    <div class="fb small">What does it mean? Pick one.</div>
    <div class="options">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="main">${o.cn}</span><span class="sub">${o.pinyin}</span></button>`).join("")}
    </div>
    <div class="fb" id="transFb"></div>`;
}
function transOptions(main){
  const others = shuffle(S.unit.trans.filter(x => x.en !== main.en).slice(0, 2));
  return shuffle([main].concat(others));
}
function onTrans(e){
  const btn = e.target.closest(".opt");
  if (!btn || S.answered) return;
  ensureAudio();
  const main = S.queue[S.idx];
  const opts = $("gameBody").querySelectorAll(".opt");
  const isRight = btn.querySelector(".main").textContent === main.cn;
  if (isRight){
    S.answered = true;
    addScore(true); sRight(); celebrate(10);
    opts.forEach(o=>{ if(o.querySelector(".main").textContent === main.cn) o.classList.add("right"); });
    $("transFb").innerHTML = fbHTML(praise(), "ok");
    setTimeout(nextQ, 1200);
  } else {
    addScore(false); sWrong();
    btn.classList.add("wrong");
    $("transFb").innerHTML = fbHTML("Not quite. Try again!", "no");
  }
}

/* ---------- 4) Fill in the Blanks ---------- */
function blankHTML(){
  const p = S.unit.blank.passage;
  const parts = p.text.split("___");
  let html = "<div class=\"passage\">" + parts[0];
  for (let i=0;i<p.blanks.length;i++){
    const v = S.blanks[i];
    const cls = "blank" + (S.selBlank === i ? " sel" : "") + (v ? " filled" : "");
    html += '<span class="' + cls + '" data-i="' + i + '">' + (v ? v : "&nbsp;&nbsp;") + "</span>" + (parts[i+1] || "");
  }
  html += "</div>";
  const used = S.blanks.filter(Boolean);
  let bank = "";
  S.bankOrder.forEach((w, i) => {
    const isUsed = used.indexOf(w.en) !== -1;
    const isSel = S.selWord === i;
    const hint = (w.base && w.base !== w.en ? w.base + " · " : "") + w.cn;
    bank += `<button class="word-btn ${isUsed?"used":""} ${isSel?"sel":""}" data-word="${w.en}"><span class="wb-en">${w.en}</span><span class="wb-cn">${hint}</span></button>`;
  });
  const allFilled = used.length === p.blanks.length;
  return `
    <div class="match-tip">Read the story. Tap a blank, then tap a word.</div>
    ${html}
    <button class="sound-btn" data-act="saypassage"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 10v4h4l5 4V6L7 10H3zm13 2a3 3 0 0 0-2-2.8V14.8A3 3 0 0 0 16 12zM14 4v1.6a6 6 0 0 1 0 10.8V18a7.5 7.5 0 0 0 0-14z"/></svg>Hear the story</button>
    <div class="wordbank"><div class="bank-label">WORD BANK</div>${bank}</div>
    <button class="primary-btn" data-act="checkblank" ${allFilled?"":"disabled"}>Check</button>
    <div class="fb" id="blankFb"></div>`;
}
function passageSpeakText(){
  const p = S.unit.blank.passage;
  const parts = p.text.split("___");
  let t = parts[0];
  for (let i=0;i<p.blanks.length;i++){
    t += (S.blanks[i] || "") + (parts[i+1] || "");
  }
  return t;
}
function onBlankClick(e){
  if (S.answered) return;
  const b = e.target.closest(".blank");
  if (!b) return;
  const i = +b.getAttribute("data-i");
  if (S.blanks[i]){ // clear it
    S.blanks[i] = null;
    S.selBlank = -1; S.selWord = -1;
  } else if (S.selWord !== -1){
    const w = S.bankOrder[S.selWord];
    if (w){ S.blanks[i] = w.en; S.selWord = -1; }
  } else {
    S.selBlank = (S.selBlank === i) ? -1 : i;
  }
  ensureAudio(); sClick();
  rerenderBlank();
}
function onWordClick(e){
  if (S.answered) return;
  const wb = e.target.closest(".word-btn");
  if (!wb || wb.classList.contains("used")) return;
  const w = wb.getAttribute("data-word");
  const idx = S.bankOrder.findIndex(o => o.en === w);
  if (S.selBlank !== -1 && !S.blanks[S.selBlank]){
    S.blanks[S.selBlank] = w;
    S.selBlank = -1; S.selWord = -1;
  } else {
    S.selWord = (S.selWord === idx) ? -1 : idx;
    S.selBlank = -1;
  }
  ensureAudio(); sClick();
  rerenderBlank();
}
function rerenderBlank(){
  const body = $("gameBody");
  // re-render passage part only
  const p = S.unit.blank.passage;
  const parts = p.text.split("___");
  let html = "<div class=\"passage\">" + parts[0];
  for (let i=0;i<p.blanks.length;i++){
    const v = S.blanks[i];
    const cls = "blank" + (S.selBlank === i ? " sel" : "") + (v ? " filled" : "");
    html += '<span class="' + cls + '" data-i="' + i + '">' + (v ? v : "&nbsp;&nbsp;") + "</span>" + (parts[i+1] || "");
  }
  html += "</div>";
  const oldP = body.querySelector(".passage");
  oldP.outerHTML = html;
  // re-render word bank
  const used = S.blanks.filter(Boolean);
  let bank = "";
  S.bankOrder.forEach((w, i) => {
    const isUsed = used.indexOf(w.en) !== -1;
    const isSel = S.selWord === i;
    const hint = (w.base && w.base !== w.en ? w.base + " · " : "") + w.cn;
    bank += `<button class="word-btn ${isUsed?"used":""} ${isSel?"sel":""}" data-word="${w.en}"><span class="wb-en">${w.en}</span><span class="wb-cn">${hint}</span></button>`;
  });
  const wb = body.querySelector(".wordbank");
  wb.innerHTML = '<div class="bank-label">WORD BANK</div>' + bank;
  const allFilled = used.length === p.blanks.length;
  const check = body.querySelector('[data-act="checkblank"]');
  check.disabled = !allFilled;
  // rebind
  body.querySelectorAll(".blank").forEach(b=>b.addEventListener("click", onBlankClick));
  body.querySelectorAll(".word-btn").forEach(b=>b.addEventListener("click", onWordClick));
}
function checkBlank(){
  if (S.answered) return;
  const p = S.unit.blank.passage;
  const blanks = p.blanks;
  let correct = 0, wrong = 0;
  for (let i=0;i<blanks.length;i++){
    if (S.locked[i]) continue;
    if (S.blanks[i] === blanks[i]){ S.locked[i] = true; correct++; }
    else wrong++;
  }
  addScoreN(correct, wrong);
  const body = $("gameBody");
  const blanksEls = body.querySelectorAll(".blank");
  blanksEls.forEach((el, i) => {
    el.classList.remove("sel","filled");
    if (S.locked[i]) el.classList.add("good");
    else if (S.blanks[i] !== blanks[i]) el.classList.add("bad");
  });
  const check = body.querySelector('[data-act="checkblank"]');
  if (wrong > 0){
    $("blankFb").innerHTML = fbHTML("You got " + correct + " of " + blanks.length + " right so far. Tap a red blank and try again!", "no");
    if (correct > 0){ sRight(); setTimeout(()=> sWrong(), 260); }
    else sWrong();
    if (check) check.disabled = true; // must fix a blank before checking again
    return;
  }
  S.answered = true;
  sWin(); celebrate(26);
  if (check) check.disabled = true;
  $("blankFb").innerHTML = fbHTML("You got all " + blanks.length + "! The story is finished!", "ok");
  setTimeout(()=> finishLevel(), 1800);
}
function addScoreN(correct, wrong){
  S.correct += correct; S.wrong += wrong;
  S.score = Math.max(0, S.score + correct*3 - wrong);
  paintHead();
}

/* ---------- next / finish ---------- */
function nextQ(){
  S.idx++; S.input = ""; S.inputPast = ""; S.answered = false; S.sel = null;
  if (S.idx >= S.queue.length){ finishLevel(); return; }
  renderGame();
}
function finishLevel(){
  speechSynthesis.cancel();
  const sc = loadScores();
  sc[S.mode] = S.score;
  localStorage.setItem("tmp_scores", JSON.stringify(sc));
  showView("result");
  renderResult();
}
function renderResult(){
  const l = LEVELS[S.levelIdx];
  const total = S.mode === "blank" ? S.unit.blank.passage.blanks.length : (S.mode === "match" ? S.unit.match.length : S.queue.length);
  const msg = S.score >= 13 ? "Amazing!" : (S.score >= 8 ? "Great work!" : "Keep practicing!");
  const isLast = S.levelIdx >= LEVELS.length - 1;
  $("resultBox").innerHTML = `
    <h2>Level Complete!</h2>
    <div class="result-pearls">${pearlsHTML(Math.min(5, S.correct), 5, "")}</div>
    <div class="score-label">Your Score</div>
    <div class="score-big">${S.score}</div>
    <div class="correct-line">${S.correct} correct answers · ${msg}</div>
    <div class="result-actions">
      ${isLast
        ? `<button class="primary-btn" id="totalBtn">See Total Score</button>`
        : `<button class="primary-btn" id="nextBtn">Next Level</button>`}
      <button class="ghost-btn" id="homeBtn">Back Home</button>
    </div>`;
  sWin(); celebrate(34);
  const nb = $("nextBtn");
  if (nb) nb.addEventListener("click", ()=> startLevel(S.levelIdx + 1));
  $("totalBtn") && $("totalBtn").addEventListener("click", ()=>{ ensureAudio(); showTotal(); });
  $("homeBtn").addEventListener("click", ()=>{ ensureAudio(); showView("home"); renderHome(); });
}
function showTotal(){
  ensureAudio();
  const sc = loadScores();
  $("totalScore").textContent = totalScore();
  $("totalTable").innerHTML = LEVELS.map(l =>
    `<div class="trow"><span class="tname"><img src="${l.img}" alt="">${l.name}</span><span class="tval">${sc[l.id] !== undefined ? sc[l.id] : "—"}</span></div>`
  ).join("") + `<div class="trow total"><span class="tname">Total</span><span class="tval">${totalScore()}</span></div>`;
  showView("total");
  sWin(); celebrate(44);
}

/* ---------- celebrate ---------- */
function celebrate(n){
  if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const colors = ["#FFC93C","#FF7B9C","#2FBF71","#5B7CE8","#FF9A9A","#2AA8B8"];
  for (let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "confetti";
    d.style.left = (Math.random()*100) + "vw";
    d.style.top = "-20px";
    const s = 7 + Math.random()*8;
    d.style.width = s + "px"; d.style.height = s + "px";
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration = (1.2 + Math.random()*1.2) + "s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2600);
  }
}

/* ---------- bind ---------- */
function bindGame(){
  const body = $("gameBody");
  body.querySelectorAll('[data-act="say"]').forEach(b=>{
    b.addEventListener("click", ()=>{ ensureAudio(); speak(b.getAttribute("data-text")); sClick(); });
  });
  if (S.mode === "spell"){
    body.querySelectorAll(".spell-input").forEach(inp => {
      const tgt = inp.getAttribute("data-tgt");
      const w = S.queue[S.idx];
      inp.addEventListener("input", ()=>{
        const val = inp.value.toLowerCase();
        if (tgt === "past") S.inputPast = val; else S.input = val;
        const len = tgt === "past" ? w.past.length : w.en.length;
        body.querySelectorAll(tgt === "past" ? '.slots[data-tgt="past"] .slot' : '.slots[data-tgt="base"] .slot').forEach((el,i)=>{
          el.textContent = val[i] ? val[i].toUpperCase() : "";
          el.classList.toggle("fill", i < val.length);
        });
        const btn = body.querySelector('[data-act="check"]');
        const baseOk = S.input.length === w.en.length;
        const pastOk = !w.past || S.inputPast.length === w.past.length;
        btn.disabled = !(baseOk && pastOk);
      });
      inp.addEventListener("keydown", (e)=>{ if (e.key === "Enter") spellCheck(); });
    });
    body.querySelector('[data-act="hint"]').addEventListener("click", ()=>{
      S.hintOn = !S.hintOn; ensureAudio(); sClick(); renderGame();
    });
    body.querySelector('[data-act="check"]').addEventListener("click", spellCheck);
  }
  if (S.mode === "match"){
    body.querySelectorAll(".pair-card").forEach(c=>c.addEventListener("click", onPair));
    body.querySelectorAll(".mini-say").forEach(b=>{
      b.addEventListener("click", ()=>{
        ensureAudio(); sClick();
        speak(b.getAttribute("data-en"));
      });
    });
    setTimeout(drawLines, 60);
  }
  if (S.mode === "trans"){
    body.querySelectorAll(".opt").forEach(o=>o.addEventListener("click", onTrans));
  }
  if (S.mode === "blank"){
    body.querySelectorAll(".blank").forEach(b=>b.addEventListener("click", onBlankClick));
    body.querySelectorAll(".word-btn").forEach(b=>b.addEventListener("click", onWordClick));
    body.querySelector('[data-act="checkblank"]').addEventListener("click", checkBlank);
    const sp = body.querySelector('[data-act="saypassage"]');
    if (sp) sp.addEventListener("click", ()=>{ ensureAudio(); speak(passageSpeakText()); sClick(); });
  }
}
window.addEventListener("resize", ()=>{ if (S.mode === "match" && $("view-game").classList.contains("active")) drawLines(); });

/* ---------- init ---------- */
paintMute(); bindMute();
document.querySelectorAll(".level").forEach(b => b.addEventListener("click", ()=> startLevel(+b.getAttribute("data-idx"))));
$("backBtn").addEventListener("click", ()=>{ speechSynthesis.cancel(); showView("home"); renderHome(); });
$("totalHomeBtn").addEventListener("click", ()=>{ speechSynthesis.cancel(); showView("home"); renderHome(); });
renderHome();
if ("speechSynthesis" in window){ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = ()=>{}; }
</script>
</body>
